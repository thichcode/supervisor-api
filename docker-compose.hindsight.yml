services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight-api
    network_mode: host
    ports:
      - "8888:8888"  # API
      - "9999:9999"  # UI
    environment:
      # LLM Provider - dùng Ollama từ host
      - HINDSIGHT_API_LLM_PROVIDER=ollama
      - HINDSIGHT_API_LLM_BASE_URL=http://localhost:8088
      - HINDSIGHT_API_LLM_MODEL=llama3
      - HINDSIGHT_API_LLM_TIMEOUT=60
      - HINDSIGHT_API_DISABLE_FACT_EXTRACTION=true
      # Database - dùng chung PostgreSQL với supervisor (port 5432)
      - HINDSIGHT_DB_HOST=localhost
      - HINDSIGHT_DB_PORT=5432
      - HINDSIGHT_DB_NAME=hindsight_db
      - HINDSIGHT_DB_USER=postgres
      - HINDSIGHT_DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    depends_on:
      - postgres  # Ensure supervisor's postgres is running first

  # Optional: Separate PostgreSQL for Hindsight (use this OR supervisor's postgres)
  # Uncomment nếu muốn dùng PostgreSQL riêng
  # postgres:
  #   image: pgvector/pgvector:pg16
  #   container_name: hindsight-postgres
  #   network_mode: host
  #   ports:
  #     - "5433:5432"
  #   environment:
  #     - POSTGRES_DB=hindsight_db
  #     - POSTGRES_USER=postgres
  #     - POSTGRES_PASSWORD=${DB_PASSWORD}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data

volumes:
  hindsight-data: