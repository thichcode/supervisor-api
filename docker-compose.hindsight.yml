version: '3.8'

services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight-api
    network_mode: host
    ports:
      - "8888:8888"  # API
      - "9999:9999"  # UI
    environment:
      # LLM Provider - dùng Ollama từ host
      - HINDSIGHT_API_LLM_PROVIDER=ollama
      - HINDSIGHT_API_LLM_BASE_URL=http://localhost:8088
      - HINDSIGHT_API_LLM_MODEL=llama3
      - HINDSIGHT_API_LLM_TIMEOUT=60
      - HINDSIGHT_API_DISABLE_FACT_EXTRACTION=true
      # Database - use external postgres
      - HINDSIGHT_DB_HOST=localhost
      - HINDSIGHT_DB_PORT=5432
      - HINDSIGHT_DB_NAME=hindsight_db
      - HINDSIGHT_DB_USER=postgres
      - HINDSIGHT_DB_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - hindsight-data:/home/hindsight/.pg0

  postgres:
    image: pgvector/pgvector:pg16
    container_name: hindsight-postgres
    environment:
      - POSTGRES_DB=hindsight_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  hindsight-data:
  postgres-data: