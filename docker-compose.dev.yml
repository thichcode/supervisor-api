version: '3.8'

services:
  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supervisor-api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=supervisor_db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-10}
      - APP_ENV=${APP_ENV:-development}
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - APP_PORT=${APP_PORT:-8000}
      - APP_WORKERS=${APP_WORKERS:-1}
      - APP_DEBUG=true
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
      # LLM Configuration - phải set trong .env, không có default
      - LLM_PROVIDER=${LLM_PROVIDER}
      - LLM_MODEL=${LLM_MODEL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT}
      - OLLAMA_IMAGE_MODEL=${OLLAMA_IMAGE_MODEL}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS}
      - LLM_HEALTHCHECK_ENABLED=${LLM_HEALTHCHECK_ENABLED}
      - LLAMACPP_BASE_URL=${LLAMACPP_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-01}
      - AZURE_DEPLOYMENT_NAME=${AZURE_DEPLOYMENT_NAME:-}
      - WEBHOOK_INPUT_SECRET=${WEBHOOK_INPUT_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - HMAC_SECRET=${HMAC_SECRET:-}
      - API_KEYS=${API_KEYS:-}
      - POWER_AUTOMATE_WEBHOOK_URL=${POWER_AUTOMATE_WEBHOOK_URL:-}
      - WEBHOOK_TIMEOUT=${WEBHOOK_TIMEOUT:-30}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_APPROVAL_CHAT_IDS=${TELEGRAM_APPROVAL_CHAT_IDS:-}
      - TELEGRAM_PARSE_MODE=${TELEGRAM_PARSE_MODE:-Markdown}
      - APPROVAL_NOTIFICATION_COOLDOWN_SECONDS=${APPROVAL_NOTIFICATION_COOLDOWN_SECONDS:-0}
      - MEMORY_CONVERSATION_TTL=${MEMORY_CONVERSATION_TTL:-86400}
      - MEMORY_SUMMARY_TTL=${MEMORY_SUMMARY_TTL:-604800}
      - MEMORY_MAX_TOKENS=${MEMORY_MAX_TOKENS:-4000}
      - ENABLE_TOOLS=${ENABLE_TOOLS:-true}
      - ENABLE_REASONING_LOOP=${ENABLE_REASONING_LOOP:-false}
      - REASONING_LOOP_MAX_ITERATIONS=${REASONING_LOOP_MAX_ITERATIONS:-3}
      - REASONING_LOOP_TOOL_RETRY=${REASONING_LOOP_TOOL_RETRY:-1}
      - ENABLE_LLM_TOOL_PLANNING=${ENABLE_LLM_TOOL_PLANNING:-false}
      - REASONING_LOOP_ROLLOUT_USER_PERCENT=${REASONING_LOOP_ROLLOUT_USER_PERCENT:-100}
      - REASONING_LOOP_ROLLOUT_TEAM_PERCENT=${REASONING_LOOP_ROLLOUT_TEAM_PERCENT:-100}
      - REASONING_LOOP_ROLLOUT_SALT=${REASONING_LOOP_ROLLOUT_SALT:-reasoning-loop-v1}
      - ENABLE_FACT_STORE=${ENABLE_FACT_STORE:-true}
      - ENABLE_SUBAGENT_DELEGATION=${ENABLE_SUBAGENT_DELEGATION:-true}
      - ENABLE_USER_STYLE_LEARNING=${ENABLE_USER_STYLE_LEARNING:-true}
      - USER_STYLE_LEARNING_USER_ID=${USER_STYLE_LEARNING_USER_ID:-}
      - USER_STYLE_LEARNING_USER_IDS=${USER_STYLE_LEARNING_USER_IDS:-}
      - N8N_BASE_URL=${N8N_BASE_URL:-http://localhost:5678}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      - EXTRA_HOSTS=${EXTRA_HOSTS:-host.docker.internal:host-gateway}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - all_proxy=${all_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro
    extra_hosts:
      - "${EXTRA_HOSTS:-host.docker.internal:host-gateway}"
    command: python -m uvicorn src.api:app --host 0.0.0.0 --port 8000 --reload

  postgres:
    image: postgres:16-alpine
    container_name: supervisor-postgres-dev
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=supervisor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: supervisor-redis-dev
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
