name: Version Bump & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.version.outputs.new_tag }}
      bump_type: ${{ steps.version.outputs.bump_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: get-latest
        run: |
          git fetch --tags
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

      - name: Analyze commits
        id: analyze
        run: |
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            COMMITS=$(git log $(git describe --tags --abbrev=0)..HEAD --oneline --format=%s)
          else
            COMMITS=$(git log --oneline --format=%s)
          fi
          
          echo "Commits to analyze:"
          echo "$COMMITS"
          
          if echo "$COMMITS" | grep -qE "^feat!|^BREAKING|^.+\!:"; then
            echo "bump_type=minor" >> $GITHUB_OUTPUT
            echo "Major or breaking change detected"
          elif echo "$COMMITS" | grep -qE "^feat[:\(]"; then
            echo "bump_type=minor" >> $GITHUB_OUTPUT
            echo "Feature detected - minor bump"
          elif echo "$COMMITS" | grep -qE "^fix[:\(]"; then
            echo "bump_type=patch" >> $GITHUB_OUTPUT
            echo "Fix detected - patch bump"
          else
            echo "bump_type=patch" >> $GITHUB_OUTPUT
            echo "Default - patch bump"
          fi

      - name: Compute new version
        id: version
        run: |
          LATEST=${{ steps.get-latest.outputs.latest }}
          VERSION="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          
          # Use manual input or auto-detected
          BUMP_TYPE=${{ github.event.inputs.bump_type }}
          if [ "$BUMP_TYPE" = "auto" ] || [ -z "$BUMP_TYPE" ]; then
            BUMP_TYPE=${{ steps.analyze.outputs.bump_type }}
          fi
          
          echo "Bump type: $BUMP_TYPE"
          
          case $BUMP_TYPE in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Previous: $LATEST -> New: $NEW_TAG"

      - name: Create Tag
        if: steps.version.outputs.new_tag != steps.get-latest.outputs.latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.new_tag }} -m "Release ${{ steps.version.outputs.new_tag }}"
          git push origin ${{ steps.version.outputs.new_tag }}
        shell: bash

      - name: Create GitHub Release
        if: steps.version.outputs.new_tag != steps.get-latest.outputs.latest
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          generate_release_notes: true
          name: Release ${{ steps.version.outputs.new_tag }}
          body: |
            ## What's New
            
            This release includes updates to the Multi-Agent Supervisor System.
            
            **Version:** ${{ steps.version.outputs.new_tag }}
            **Bump Type:** ${{ steps.version.outputs.bump_type }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}