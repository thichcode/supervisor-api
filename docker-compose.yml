services:
  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supervisor-api
    network_mode: host
    extra_hosts:
      - "${EXTRA_HOSTS:-host.docker.internal:host-gateway}"
    environment:
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_NAME=supervisor_db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - REDIS_DB=${REDIS_DB:-0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_POOL_SIZE=${REDIS_POOL_SIZE:-10}
      # App
      - APP_ENV=${APP_ENV:-production}
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - APP_PORT=${APP_PORT:-8000}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_WORKERS=${APP_WORKERS:-4}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # LLM Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3}
      # Point to llama.cpp running on the host network
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://localhost:8088}
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:-llama3}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-320}
      - OLLAMA_IMAGE_MODEL=${OLLAMA_IMAGE_MODEL:-llama3.1-vision}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2000}
      - LLM_HEALTHCHECK_ENABLED=${LLM_HEALTHCHECK_ENABLED:-false}
      # Optional: OpenAI (fallback if Ollama unavailable)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Azure OpenAI (optional)
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY:-}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2024-02-01}
      - AZURE_DEPLOYMENT_NAME=${AZURE_DEPLOYMENT_NAME:-}
      # Webhook
      - WEBHOOK_INPUT_SECRET=${WEBHOOK_INPUT_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - HMAC_SECRET=${HMAC_SECRET:-}
      - API_KEYS=${API_KEYS:-}
      - POWER_AUTOMATE_WEBHOOK_URL=${POWER_AUTOMATE_WEBHOOK_URL:-}
      - WEBHOOK_TIMEOUT=${WEBHOOK_TIMEOUT:-30}
      # Telegram Approval
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ENABLE_TELEGRAM_GATEWAY=${ENABLE_TELEGRAM_GATEWAY:-true}
      - TELEGRAM_APPROVAL_CHAT_IDS=${TELEGRAM_APPROVAL_CHAT_IDS:-}
      - TELEGRAM_PARSE_MODE=${TELEGRAM_PARSE_MODE:-Markdown}
      - APPROVAL_NOTIFICATION_COOLDOWN_SECONDS=${APPROVAL_NOTIFICATION_COOLDOWN_SECONDS:-0}
      # Memory
      - MEMORY_CONVERSATION_TTL=${MEMORY_CONVERSATION_TTL:-86400}
      - MEMORY_SUMMARY_TTL=${MEMORY_SUMMARY_TTL:-604800}
      - MEMORY_MAX_TOKENS=${MEMORY_MAX_TOKENS:-4000}
      - MEMPALACE_ENABLED=${MEMPALACE_ENABLED:-false}
      - MEMPALACE_PATH=${MEMPALACE_PATH:-}
      - MEMPALACE_TOP_K=${MEMPALACE_TOP_K:-3}
      - MEMPALACE_TIMEOUT_SECONDS=${MEMPALACE_TIMEOUT_SECONDS:-2.0}
      - MEMPALACE_RETRY_ATTEMPTS=${MEMPALACE_RETRY_ATTEMPTS:-2}
      - MEMPALACE_CIRCUIT_FAILURE_THRESHOLD=${MEMPALACE_CIRCUIT_FAILURE_THRESHOLD:-3}
      - MEMPALACE_CIRCUIT_SUCCESS_THRESHOLD=${MEMPALACE_CIRCUIT_SUCCESS_THRESHOLD:-2}
      - MEMPALACE_CIRCUIT_TIMEOUT_SECONDS=${MEMPALACE_CIRCUIT_TIMEOUT_SECONDS:-30.0}
      - FILE_MEMORY_ENABLED=${FILE_MEMORY_ENABLED:-false}
      - FILE_MEMORY_PATH=${FILE_MEMORY_PATH:-}
      # Feature flags / reasoning
      - ENABLE_TOOLS=${ENABLE_TOOLS:-true}
      - ENABLE_REASONING_LOOP=${ENABLE_REASONING_LOOP:-false}
      - REASONING_LOOP_MAX_ITERATIONS=${REASONING_LOOP_MAX_ITERATIONS:-3}
      - REASONING_LOOP_TOOL_RETRY=${REASONING_LOOP_TOOL_RETRY:-1}
      - ENABLE_LLM_TOOL_PLANNING=${ENABLE_LLM_TOOL_PLANNING:-false}
      - REASONING_LOOP_ROLLOUT_USER_PERCENT=${REASONING_LOOP_ROLLOUT_USER_PERCENT:-100}
      - REASONING_LOOP_ROLLOUT_TEAM_PERCENT=${REASONING_LOOP_ROLLOUT_TEAM_PERCENT:-100}
      - REASONING_LOOP_ROLLOUT_SALT=${REASONING_LOOP_ROLLOUT_SALT:-reasoning-loop-v1}
      - ENABLE_FACT_STORE=${ENABLE_FACT_STORE:-true}
      - ENABLE_SUBAGENT_DELEGATION=${ENABLE_SUBAGENT_DELEGATION:-true}
      - ENABLE_USER_STYLE_LEARNING=${ENABLE_USER_STYLE_LEARNING:-true}
      - USER_STYLE_LEARNING_USER_ID=${USER_STYLE_LEARNING_USER_ID:-}
      - USER_STYLE_LEARNING_USER_IDS=${USER_STYLE_LEARNING_USER_IDS:-}
      # n8n
      - N8N_BASE_URL=${N8N_BASE_URL:-http://localhost:5678}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-}
      # Notifications
      - ENABLE_NOTIFICATION=${ENABLE_NOTIFICATION:-false}
      - NOTIFICATION_EMAIL_ENABLED=${NOTIFICATION_EMAIL_ENABLED:-false}
      - NOTIFICATION_SMS_ENABLED=${NOTIFICATION_SMS_ENABLED:-false}
      - NOTIFICATION_TEAMS_ENABLED=${NOTIFICATION_TEAMS_ENABLED:-true}
      - NOTIFICATION_WEBHOOK_URL=${NOTIFICATION_WEBHOOK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=${FROM_EMAIL:-}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
      # Scheduler
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-false}
      - SCHEDULER_CRON_DEFAULT=${SCHEDULER_CRON_DEFAULT:-0 9 * * *}
      # Rate limits
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60}
      # Optional outbound proxy for Telegram/API egress
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - all_proxy=${all_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  postgres:
    image: postgres:16-alpine
    container_name: supervisor-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=supervisor_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: supervisor-redis
    command: >
      sh -c 'redis-server
      --requirepass "${REDIS_PASSWORD:-}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru'
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  prometheus:
    image: prom/prometheus:latest
    container_name: supervisor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: supervisor-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  kb-draft-cron:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supervisor-kb-draft-cron
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=supervisor_db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_APPROVAL_CHAT_IDS=${TELEGRAM_APPROVAL_CHAT_IDS:-}
    entrypoint: ["/bin/sh", "-c"]
    command: >
     /bin/sh -c 'echo "0 20 * * * cd /app && python3 scripts/daily_kb_draft_worker.py --send-telegram" > /etc/crontabs/root && cron -f'
    networks:
      - default
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

