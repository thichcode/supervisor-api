# Full production deployment: supervisor-api + Hindsight + LLM
services:
  # ============ SUPERVISOR API ============
  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supervisor-api
    network_mode: host
    environment:
      - APP_ENV=production
      - APP_PORT=8000
      # Database
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_NAME=supervisor_db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      # Redis
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # LLM - phải set trong .env, không hardcode
      - LLM_MODEL=${LLM_MODEL}
      - LLM_PROVIDER=${LLM_PROVIDER}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT}
      - LLAMACPP_BASE_URL=${LLAMACPP_BASE_URL}
      # Style Learning
      - USER_STYLE_LEARNING_USER_IDS=${USER_STYLE_LEARNING_USER_IDS}
      # Hindsight
      - HINDSIGHT_ENABLED=true
      - HINDSIGHT_BASE_URL=http://hindsight:8000
      - HINDSIGHT_BANK_ID=supervisor-api
      # Telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_APPROVAL_CHAT_IDS=${TELEGRAM_APPROVAL_CHAT_IDS}
      # Webhook
      - WEBHOOK_INPUT_SECRET=${WEBHOOK_INPUT_SECRET}
      - POWER_AUTOMATE_WEBHOOK_URL=${POWER_AUTOMATE_WEBHOOK_URL}
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config:ro

  # ============ POSTGRESQL (supervisor) ============
  postgres:
    image: postgres:16
    container_name: supervisor-postgres
    environment:
      - POSTGRES_DB=supervisor_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-supervisor:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  # ============ REDIS ============
  redis:
    image: redis:7-alpine
    container_name: supervisor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # ============ HINDSIGHT (Agent Memory) ============
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: hindsight-api
    network_mode: host
    ports:
      - "8888:8888"  # API
      - "9999:9999"  # UI (Control Plane)
    environment:
      # LLM - dùng llama.cpp trên host (phải set trong .env)
      - HINDSIGHT_API_LLM_PROVIDER=${HINDSIGHT_LLM_PROVIDER}
      - HINDSIGHT_API_LLM_BASE_URL=${HINDSIGHT_LLM_BASE_URL}
      - HINDSIGHT_API_LLM_MODEL=${HINDSIGHT_LLM_MODEL}
      - HINDSIGHT_API_LLM_TIMEOUT=${HINDSIGHT_LLM_TIMEOUT}
      # Database - PostgreSQL riêng cho Hindsight
      - HINDSIGHT_DB_HOST=localhost
      - HINDSIGHT_DB_PORT=5433
      - HINDSIGHT_DB_NAME=hindsight_db
      - HINDSIGHT_DB_USER=postgres
      - HINDSIGHT_DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    restart: unless-stopped

  # ============ POSTGRESQL (Hindsight) ============
  hindsight-postgres:
    image: pgvector/pgvector:pg16
    container_name: hindsight-postgres
    environment:
      - POSTGRES_DB=hindsight_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-hindsight:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

volumes:
  postgres-supervisor:
  postgres-hindsight:
  redis-data:
  hindsight-data: